<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0a0f1c" />
<title>Muscu Coach Pro</title>
<style>
:root{
  --bg:#08111f;--panel:#0f1b2d;--panel2:#15243a;--line:#243550;--text:#edf4ff;--muted:#8ea4c2;
  --accent:#5ce1e6;--accent2:#7c5cff;--good:#42d392;--warn:#ffbe5c;--bad:#ff6b7a;--hyper:#ff7a59;--force:#7c8dff;
  --radius:18px;--shadow:0 12px 35px rgba(0,0,0,.22)
}
*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#07101d,#0a1220 45%,#08111f);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100%}
body{padding-bottom:88px}.app{max-width:980px;margin:0 auto;padding:18px 14px 40px}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;background:rgba(8,17,31,.88);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06);padding:12px 14px;margin:-18px -14px 14px}
.topbar .row{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:19px;font-weight:900;letter-spacing:.2px}.sub{color:var(--muted);font-size:12px}.badge{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(92,225,230,.12);color:var(--accent);border:1px solid rgba(92,225,230,.18)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:linear-gradient(180deg,var(--panel),#0d1828);border:1px solid rgba(255,255,255,.07);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}.card2{background:var(--panel2);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:12px}
.h1{font-size:28px;font-weight:950;line-height:1.05}.h2{font-size:18px;font-weight:900}.h3{font-size:15px;font-weight:850}.muted{color:var(--muted)}.tiny{font-size:11px}.small{font-size:13px}.big{font-size:24px;font-weight:950}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:10px}
.btn{appearance:none;border:none;border-radius:13px;padding:11px 14px;font-weight:850;cursor:pointer;transition:.15s;min-height:42px}.btn:active{transform:scale(.98)}.primary{background:linear-gradient(135deg,var(--accent),#4fb8ff);color:#04111f}.secondary{background:#172740;color:var(--text);border:1px solid rgba(255,255,255,.08)}.danger{background:rgba(255,107,122,.12);color:#ff8a97;border:1px solid rgba(255,107,122,.2)}.ghost{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.08)}
input,select,textarea{width:100%;background:#0b1626;border:1px solid #263954;color:var(--text);border-radius:12px;padding:10px 11px;outline:none;font-size:14px}input:focus,select:focus,textarea:focus{border-color:var(--accent)}label{font-size:11px;color:var(--muted);display:block;margin:0 0 5px}.field{min-width:0}.pill{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:850}.p-hyper{background:rgba(255,122,89,.12);color:#ff9b82}.p-force{background:rgba(124,141,255,.12);color:#aab4ff}.p-good{background:rgba(66,211,146,.12);color:#65e5aa}.p-warn{background:rgba(255,190,92,.12);color:#ffd28a}.p-muted{background:rgba(142,164,194,.12);color:#b5c6dd}
.kpi{padding:14px;border-radius:16px;background:linear-gradient(180deg,#14233a,#101d30);border:1px solid rgba(255,255,255,.06)}.kpi .v{font-size:22px;font-weight:950;margin-top:2px}.divider{height:1px;background:rgba(255,255,255,.07);margin:12px 0}
.exercise{padding:14px;border:1px solid rgba(255,255,255,.07);border-radius:16px;background:#101c2d}.exercise+.exercise{margin-top:10px}.ex-title{font-weight:900}.charge{font-size:22px;font-weight:950;color:var(--accent)}.setline{display:grid;grid-template-columns:52px 1fr 1fr 1fr 82px;gap:7px;align-items:end;margin-top:8px}.setline .btn{padding:8px 8px;min-height:38px}.rec{border-left:3px solid var(--accent);padding-left:10px}.superset{border:1px dashed rgba(124,141,255,.5);padding:12px;border-radius:15px;background:rgba(124,141,255,.05)}
.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;vertical-align:middle}.table th{color:#a7bbd8;font-size:11px}.table tr:last-child td{border-bottom:none}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(8,17,31,.95);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.08)}.nav-inner{max-width:980px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:none;border:none;color:#7f94b1;padding:10px 4px 12px;font-size:10px;font-weight:800}.nav button.active{color:var(--accent)}.nav .ico{display:block;font-size:19px;margin-bottom:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:99;background:#13233a;border:1px solid rgba(255,255,255,.1);padding:10px 14px;border-radius:999px;font-size:12px;box-shadow:var(--shadow)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(100%,760px);max-height:90vh;overflow:auto;background:#0b1626;border:1px solid rgba(255,255,255,.08);border-radius:24px 24px 0 0;padding:16px}
.hero{background:radial-gradient(circle at top right,rgba(92,225,230,.18),transparent 32%),linear-gradient(135deg,#101d30,#0f1b2d 55%,#17223b);overflow:hidden}.progressbar{height:8px;background:#152238;border-radius:999px;overflow:hidden}.progressbar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
@media(max-width:720px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.setline{grid-template-columns:46px 1fr 1fr 1fr}.setline .validate{grid-column:1/-1}.desktop-hide{display:block}.h1{font-size:25px}.charge{font-size:20px}}
@media(min-width:721px){.desktop-hide{display:none}.sheet{border-radius:24px;margin-bottom:30px;align-self:center}.modal{align-items:center}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><div class="row"><div><div class="brand">Muscu Coach Pro</div><div class="sub" id="topSub">Prise de masse + force</div></div><div class="badge" id="topWeek">Semaine 0</div></div></div>
  <main id="view"></main>
</div>
<nav class="nav"><div class="nav-inner">
  <button data-tab="home" class="active"><span class="ico">⌂</span>Accueil</button>
  <button data-tab="program"><span class="ico">▦</span>Programme</button>
  <button data-tab="workout"><span class="ico">＋</span>Séance</button>
  <button data-tab="tests"><span class="ico">◎</span>Tests</button>
  <button data-tab="settings"><span class="ico">⚙</span>Réglages</button>
</div></nav>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const TODAY=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const fmt=n=>Number.isFinite(+n)?(+n).toLocaleString('fr-FR',{maximumFractionDigits:1}):'—';

const EX={
 dc:{name:'Développé couché',group:'Pecs',type:'barbell',inc:2.5,principal:true},
 ohp:{name:'Développé militaire',group:'Épaules',type:'barbell',inc:2.5,principal:true},
 pullup:{name:'Tractions lestées',group:'Dos',type:'bodyweight',inc:2.5,principal:true},
 squat:{name:'Squat',group:'Jambes',type:'barbell',inc:2.5,principal:true},
 hack:{name:'Hack squat',group:'Jambes',type:'machine',inc:5,principal:true},
 rdl:{name:'Soulevé de terre roumain',group:'Jambes',type:'barbell',inc:2.5,principal:true},
 rowHeavy:{name:'Rowing lourd',group:'Dos',type:'barbell',inc:2.5,principal:true},
 inclineDB:{name:'Développé incliné haltères',group:'Pecs',type:'dumbbell',inc:2},
 chest:{name:'Chest press',group:'Pecs',type:'machine',inc:5},
 fly:{name:'Écartés poulie',group:'Pecs',type:'cable',inc:2.5},
 lateral:{name:'Élévations latérales',group:'Épaules',type:'dumbbell',inc:1},
 reverse:{name:'Reverse pec-deck / oiseau',group:'Épaules',type:'machine',inc:5},
 incline:{name:'Développé incliné',group:'Pecs',type:'barbell',inc:2.5},
 flatDB:{name:'Développé couché haltères',group:'Pecs',type:'dumbbell',inc:2},
 decline:{name:'Chest press déclinée / dips',group:'Pecs',type:'machine',inc:2.5},
 flyHB:{name:'Écartés poulie haute → basse',group:'Pecs',type:'cable',inc:2.5},
 latCable:{name:'Élévations latérales poulie',group:'Épaules',type:'cable',inc:1.25},
 press:{name:'Presse à cuisses',group:'Jambes',type:'machine',inc:5},
 bulgarian:{name:'Fentes bulgares',group:'Jambes',type:'dumbbell',inc:2},
 legExt:{name:'Leg extension',group:'Jambes',type:'machine',inc:5},
 legCurl:{name:'Leg curl',group:'Jambes',type:'machine',inc:5},
 calves:{name:'Mollets',group:'Jambes',type:'machine',inc:5},
 abs:{name:'Abdos',group:'Core',type:'bodyweight',inc:1},
 hip:{name:'Hip thrust',group:'Jambes',type:'barbell',inc:2.5},
 pressHigh:{name:'Presse pieds hauts',group:'Jambes',type:'machine',inc:5},
 adduct:{name:'Adducteurs',group:'Jambes',type:'machine',inc:5},
 abduct:{name:'Abducteurs',group:'Jambes',type:'machine',inc:5},
 rowChest:{name:'Rowing poitrine appuyée',group:'Dos',type:'machine',inc:5},
 latNeutral:{name:'Tirage vertical prise neutre',group:'Dos',type:'cable',inc:2.5},
 rowCable:{name:'Rowing unilatéral poulie basse',group:'Dos',type:'cable',inc:2.5},
 pulloverCable:{name:'Pullover poulie',group:'Dos',type:'cable',inc:2.5},
 curlEZ:{name:'Curl EZ',group:'Biceps',type:'barbell',inc:2.5},
 triPush:{name:'Extension triceps poulie',group:'Triceps',type:'cable',inc:1.25},
 curlIncl:{name:'Curl incliné',group:'Biceps',type:'dumbbell',inc:1},
 triOH:{name:'Extension triceps au-dessus tête',group:'Triceps',type:'cable',inc:1.25},
 curlCable:{name:'Curl poulie',group:'Biceps',type:'cable',inc:1.25},
 rope:{name:'Pushdown corde',group:'Triceps',type:'cable',inc:1.25},
 lat:{name:'Tirage vertical',group:'Dos',type:'cable',inc:2.5},
 rowMachine:{name:'Rowing machine',group:'Dos',type:'machine',inc:5},
 rowOne:{name:'Rowing unilatéral',group:'Dos',type:'dumbbell',inc:2},
 pullover:{name:'Pullover',group:'Dos',type:'cable',inc:2.5},
 reverseFly:{name:'Reverse fly',group:'Épaules',type:'machine',inc:5},
 preacher:{name:'Curl pupitre',group:'Biceps',type:'machine',inc:2.5},
 hammer:{name:'Curl marteau',group:'Biceps',type:'dumbbell',inc:1},
 triUni:{name:'Extension triceps unilatérale',group:'Triceps',type:'cable',inc:1.25}
};

const BASE={
 mon:[
  ['dc',4,'6-8',2,180,'2-0-X-0'],['inclineDB',3,'8-10',2,120,'2-0-X-0'],['chest',3,'10-12',1.5,105,'2-0-X-0'],['fly',2,'12-15',1.5,75,'3-0-1-0'],
  ['ohp',3,'6-10',2,150,'2-0-X-0'],['lateral',4,'12-20',1.5,75,'2-0-2-0'],['reverse',3,'15-20',1.5,75,'2-0-2-0']],
 tue:[['squat',4,'6-8',2,180,'2-0-X-0'],['press',3,'8-12',2,150,'2-0-X-0'],['bulgarian',3,'8-12',2,120,'2-0-X-0'],['legExt',3,'12-15',1.5,75,'2-1-2-0'],['legCurl',3,'10-15',1.5,90,'2-1-2-0'],['calves',4,'10-15',1.5,75,'2-1-2-1'],['abs',3,'12-20',2,60,'contrôlé']],
 wed:[['pullup',4,'6-8',2,180,'2-1-X-0'],['rowChest',4,'6-10',2,150,'2-0-X-1'],['latNeutral',3,'8-12',1.5,120,'2-1-1-0'],['rowCable',3,'10-12',1.5,105,'2-0-1-1'],['pulloverCable',2,'12-15',1.5,75,'3-0-1-1']],
 thu:[['incline',3,'8-12',2,150,'2-0-X-0'],['flatDB',3,'8-12',2,120,'2-0-X-0'],['decline',3,'8-12',1.5,120,'2-0-X-0'],['flyHB',3,'12-15',1.5,75,'3-0-1-1'],['lateral',4,'12-20',1.5,75,'2-0-2-0'],['latCable',3,'12-20',1.5,75,'2-0-2-0'],['reverse',3,'15-20',1.5,75,'2-0-2-0']],
 fri:[['rdl',4,'6-10',2,180,'3-0-X-0'],['hack',3,'8-12',2,150,'2-0-X-0'],['hip',3,'8-12',2,120,'2-1-X-1'],['legCurl',4,'10-15',1.5,90,'2-1-2-0'],['pressHigh',2,'10-15',2,120,'2-0-X-0'],['legExt',2,'12-20',1.5,75,'2-1-2-0'],['calves',4,'12-20',1.5,75,'2-1-2-1']],
 sat:[['lat',3,'8-12',2,120,'2-1-1-0'],['rowMachine',3,'8-12',2,120,'2-0-1-1'],['rowOne',3,'10-15',1.5,105,'2-0-1-1'],['pullover',3,'12-15',1.5,75,'3-0-1-1'],['reverseFly',3,'15-20',1.5,75,'2-0-2-0']]
};
const SUPERSETS={wed:[['curlEZ','triPush','3×8-10'],['curlIncl','triOH','3×10-12'],['curlCable','rope','2×12-15']],sat:[['preacher','triOH','3×10-12'],['hammer','rope','3×10-15'],['curlCable','triUni','2×12-15']]};

const PHASES=[
 {a:0,b:0,key:'cal',name:'Calibration',desc:'Tests et réglage des charges de départ.'},
 {a:1,b:4,key:'hf',name:'Hypertrophie fondamentale',desc:'Progression en reps/charge, technique propre, RIR décroissant.'},
 {a:5,b:5,key:'deload',name:'Deload',desc:'50–60 % du volume habituel, RIR 3–4.'},
 {a:6,b:9,key:'force',name:'Force',desc:'Charges recalculées depuis tes références les plus récentes.'},
 {a:10,b:10,key:'recal',name:'Deload + recalibrage',desc:'Mini-tests 4–6RM contrôlés.'},
 {a:11,b:14,key:'heavy',name:'Hypertrophie lourde',desc:'Top sets, back-offs, pyramides et excentriques ciblés.'},
 {a:15,b:15,key:'deload',name:'Deload',desc:'Récupération.'},
 {a:16,b:19,key:'pump',name:'Volume / congestion',desc:'Supersets, dropsets, rest-pause et myo-reps ciblés.'},
 {a:20,b:20,key:'recal',name:'Deload + tests',desc:'Bilan et nouveaux repères.'}
];

function calcE1RM(load,reps,rir=0){const effective=reps+Math.max(0,+rir||0);return load>0&&reps>0?load*(1+effective/30):0}
function roundTo(n,inc){return Math.round(n/inc)*inc}
function phaseFor(w){return PHASES.find(p=>w>=p.a&&w<=p.b)||PHASES[1]}
function phaseWeek(w,p){return w-p.a}
function parseRange(s){const a=String(s).split('-').map(Number);return {min:a[0],max:a[1]||a[0]}}
function loadPctFor(range){const {min,max}=parseRange(range);const mid=(min+max)/2;if(mid<=4)return .87;if(mid<=6)return .82;if(mid<=8)return .76;if(mid<=10)return .71;if(mid<=12)return .67;if(mid<=15)return .62;return .57}
function latestTest(exId){return [...state.tests].filter(t=>t.exId===exId).sort((a,b)=>new Date(b.date)-new Date(a.date))[0]}
function e1rmRef(exId){const t=latestTest(exId);if(!t)return 0;const total=exId==='pullup'?(+t.bodyweight||state.profile.weight)+(+t.load||0):+t.load;return calcE1RM(total,+t.reps,+t.rir||0)}
function lastLogFor(exId){for(const l of [...state.logs].sort((a,b)=>new Date(b.date)-new Date(a.date))){const x=l.exercises.find(e=>e.exId===exId);if(x)return x}return null}
function workingRef(exId){return state.workingLoads[exId]||0}
function recommendedBaseLoad(exId,range){const ex=EX[exId];const last=lastLogFor(exId);if(last?.nextLoad)return last.nextLoad;if(last?.sets?.length){return last.sets[0].load||0}const wr=workingRef(exId);if(wr)return wr;const e=e1rmRef(exId);if(!e)return 0;if(exId==='pullup'){const total=e*loadPctFor(range);return Math.max(0,roundTo(total-state.profile.weight,ex.inc))}return roundTo(e*loadPctFor(range),ex.inc)}

function forcePrescription(exId,w){const e=e1rmRef(exId);if(!e)return null;const wi=w-6;const cfg=[{sets:4,reps:5,pct:.79,rir:2},{sets:5,reps:4,pct:.82,rir:2},{sets:5,reps:3,pct:.855,rir:1.5},{sets:1,reps:3,pct:.885,rir:1,top:true}][clamp(wi,0,3)];const ex=EX[exId];const toExternal=x=>exId==='pullup'?Math.max(0,roundTo(x-state.profile.weight,ex.inc)):roundTo(x,ex.inc);const load=toExternal(e*cfg.pct);if(cfg.top){return {kind:'force',sets:[{label:'Top set',sets:1,reps:'3',rir:1,load},{label:'Back-off',sets:3,reps:'5',rir:2,load:toExternal(e*(cfg.pct-.10))}]}}return {kind:'force',sets:[{label:'Travail',sets:cfg.sets,reps:String(cfg.reps),rir:cfg.rir,load}]}}

function buildDay(day,w){const p=phaseFor(w),wi=phaseWeek(w,p);if(p.key==='cal'||p.key==='recal')return {phase:p,exercises:[],supersets:[]};let base=(BASE[day]||[]).map(x=>({exId:x[0],sets:x[1],reps:x[2],rir:x[3],rest:x[4],tempo:x[5],method:'Classique'}));
 if(p.key==='hf'){const targets=[3,2,1.5,1];base=base.map(x=>({...x,rir:targets[wi]??1}))}
 if(p.key==='deload'){base=base.map(x=>({...x,sets:Math.max(1,Math.ceil(x.sets*.55)),rir:4,method:'Deload'}))}
 if(p.key==='force'){
   base=base.map(x=>{const isMain=['dc','ohp','pullup','squat','rdl','rowHeavy'].includes(x.exId);if(isMain){const fp=forcePrescription(x.exId,w);if(fp)return {...x,force:fp}}return {...x,rir:2}})
 }
 if(p.key==='heavy'){
   base=base.map((x,i)=>({...x,rir:i<2?1:1.5,method:(['dc','squat','rowHeavy','pullup'].includes(x.exId)?'Top set + back-off':(['inclineDB','rdl','latNeutral'].includes(x.exId)?'Excentrique 3 s':(i===base.length-1?'Dropset dernière série':'Classique')))}))
 }
 if(p.key==='pump'){
   base=base.map((x,i)=>({...x,rir:i<2?1.5:1,method:(i===base.length-1?'Rest-pause dernière série':(x.reps.includes('15')||x.reps.includes('20')?'Myo-reps possible dernière série':'Classique'))}))
 }
 return {phase:p,exercises:base,supersets:SUPERSETS[day]||[]}
}

const DEFAULT_STATE={
 profile:{name:'Joris',weight:70,height:183,start:TODAY(),manualWeek:0},
 tests:[
  {id:uid(),exId:'dc',date:'2026-09-15',load:75,reps:3,rir:0,note:'4e rep impossible'},
  {id:uid(),exId:'ohp',date:'2026-09-15',load:45,reps:4,rir:0,note:'5e rep ratée'},
  {id:uid(),exId:'pullup',date:'2026-09-17',bodyweight:70,load:15,reps:4,rir:.5,note:'3 séries de 4–5 reps'}
 ],
 workingLoads:{inclineDB:22,chest:40}, logs:[], disabled:[], theme:'dark'
};
const KEY='muscu-coach-pro-v1';
let state=loadState(); let currentTab='home'; let workoutDay='thu';
function loadState(){try{const x=JSON.parse(localStorage.getItem(KEY));return x?{...structuredClone(DEFAULT_STATE),...x,profile:{...DEFAULT_STATE.profile,...x.profile},workingLoads:{...DEFAULT_STATE.workingLoads,...x.workingLoads}}:structuredClone(DEFAULT_STATE)}catch{return structuredClone(DEFAULT_STATE)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function week(){return +state.profile.manualWeek||0}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}
function dayLabel(d){return {mon:'Lundi',tue:'Mardi',wed:'Mercredi',thu:'Jeudi',fri:'Vendredi',sat:'Samedi'}[d]}
function dayTitle(d){return {mon:'Pectoraux + épaules A',tue:'Jambes A',wed:'Dos + bras A',thu:'Pectoraux + épaules B',fri:'Jambes B',sat:'Dos + bras B'}[d]}

function updateTop(){const p=phaseFor(week());$('#topWeek').textContent=`Semaine ${week()}`;$('#topSub').textContent=`${p.name} · ${state.profile.weight} kg`}
function setTab(tab){currentTab=tab;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
$$('.nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

function homeView(){const w=week(),p=phaseFor(w),pct=Math.min(100,Math.round((w/20)*100));const refs=['dc','ohp','pullup'].map(id=>({id,e:e1rmRef(id)}));return `
<div class="stack">
 <section class="card hero"><div class="row between wrap"><div><div class="tiny muted">Cycle actuel</div><div class="h1">${p.name}</div><div class="small muted" style="margin-top:6px">${p.desc}</div></div><span class="pill ${p.key==='force'?'p-force':'p-hyper'}">Semaine ${w}/20</span></div><div class="progressbar" style="margin-top:16px"><div style="width:${pct}%"></div></div></section>
 <div class="grid g3">${refs.map(r=>`<div class="kpi"><div class="tiny muted">${EX[r.id].name}</div><div class="v">${r.e?fmt(r.e)+' kg':'—'}</div><div class="tiny muted">e1RM estimé</div></div>`).join('')}</div>
 <section class="card"><div class="row between"><div><div class="tiny muted">Aujourd’hui / séance rapide</div><div class="h2">${dayTitle(workoutDay)}</div></div><button class="btn primary" onclick="currentTab='workout';setTab('workout')">Démarrer</button></div><div class="divider"></div><div class="small muted">Les charges sont calculées à partir de tes tests, de tes charges de travail enregistrées et de ta dernière séance.</div></section>
 <section class="card"><div class="row between"><div class="h2">Prochaines charges clés</div><span class="pill p-good">auto</span></div><div class="grid g3" style="margin-top:12px">${['dc','inclineDB','ohp'].map(id=>{let r=id==='dc'?recommendedBaseLoad(id,'6-8'):recommendedBaseLoad(id,id==='inclineDB'?'8-10':'6-10');return `<div class="card2"><div class="tiny muted">${EX[id].name}</div><div class="big">${r?fmt(r)+' kg':'À calibrer'}</div></div>`}).join('')}</div></section>
 <section class="card"><div class="row between"><div class="h2">Repères modifiables</div><button class="btn secondary" onclick="setTab('tests')">Gérer</button></div><div class="small muted" style="margin-top:8px">Tes tests ne sont jamais confondus avec tes charges hypertrophie. Tu peux modifier ou supprimer chaque test.</div></section>
</div>`}

function programView(){const w=week(),p=phaseFor(w);return `<div class="stack"><section class="card"><div class="row between"><div><div class="h2">Programme 20 semaines</div><div class="small muted">${p.name} · semaine ${w}</div></div><span class="pill ${p.key==='force'?'p-force':'p-hyper'}">${p.key.toUpperCase()}</span></div></section>${['mon','tue','wed','thu','fri','sat'].map(day=>dayProgramCard(day,w)).join('')}</div>`}
function dayProgramCard(day,w){const d=buildDay(day,w);if(!d.exercises.length)return `<section class="card"><div class="row between"><div><div class="tiny muted">${dayLabel(day)}</div><div class="h3">${dayTitle(day)}</div></div><span class="pill p-muted">Tests / recalibrage</span></div></section>`;return `<section class="card"><div class="row between"><div><div class="tiny muted">${dayLabel(day)}</div><div class="h2">${dayTitle(day)}</div></div><button class="btn secondary" onclick="workoutDay='${day}';setTab('workout')">Ouvrir</button></div><div class="divider"></div>${d.exercises.map(x=>programExercise(x,w)).join('')}${d.supersets.length?`<div class="superset" style="margin-top:10px"><div class="h3">Supersets bras</div>${d.supersets.map(s=>`<div class="small" style="margin-top:6px"><b>${EX[s[0]].name}</b> → <b>${EX[s[1]].name}</b> · ${s[2]} · repos 90 s</div>`).join('')}</div>`:''}</section>`}
function programExercise(x,w){const rec=x.force?x.force.sets[0].load:recommendedBaseLoad(x.exId,x.reps);const detail=x.force?x.force.sets.map(s=>`${s.label}: ${s.sets}×${s.reps} @RIR ${s.rir} · ${fmt(s.load)} kg`).join(' · '):`${x.sets}×${x.reps} · RIR ${x.rir} · repos ${Math.round(x.rest/60*10)/10} min · ${x.tempo}`;return `<div class="exercise"><div class="row between wrap"><div><div class="ex-title">${EX[x.exId].name}</div><div class="tiny muted">${detail}</div></div><div style="text-align:right"><div class="tiny muted">Charge conseillée</div><div class="charge">${rec?fmt(rec)+' kg':'À calibrer'}</div></div></div>${x.method&&x.method!=='Classique'?`<div class="tiny" style="margin-top:7px;color:#ffb49f">Méthode : ${x.method}</div>`:''}</div>`}

function workoutView(){const w=week(),data=buildDay(workoutDay,w);if(!data.exercises.length)return `<div class="card"><div class="h2">Semaine de calibration</div><div class="small muted" style="margin-top:6px">Va dans Tests pour enregistrer/modifier tes repères, puis passe la semaine manuellement à 1 quand tu démarres le bloc hypertrophie.</div></div>`;return `<div class="stack"><section class="card"><div class="row between wrap"><div><div class="tiny muted">Séance</div><div class="h2">${dayTitle(workoutDay)}</div><div class="small muted">${data.phase.name}</div></div><select style="width:auto" onchange="workoutDay=this.value;render()">${['mon','tue','wed','thu','fri','sat'].map(d=>`<option value="${d}" ${d===workoutDay?'selected':''}>${dayLabel(d)}</option>`).join('')}</select></div></section>${data.exercises.map(x=>workoutExercise(x,w)).join('')}${data.supersets.length?workoutSupersets(data.supersets):''}<button class="btn primary" onclick="finishWorkout()">Enregistrer la séance</button></div>`}
function workoutExercise(x,w){let sets=[];if(x.force){x.force.sets.forEach(g=>{for(let i=0;i<g.sets;i++)sets.push({reps:g.reps,rir:g.rir,load:g.load})})}else{const load=recommendedBaseLoad(x.exId,x.reps);for(let i=0;i<x.sets;i++)sets.push({reps:parseRange(x.reps).max,rir:x.rir,load})}return `<section class="card workout-ex" data-ex="${x.exId}" data-range="${x.reps}"><div class="row between wrap"><div><div class="h3">${EX[x.exId].name}</div><div class="tiny muted">${x.method||'Classique'} · tempo ${x.tempo}</div></div><div class="charge">${sets[0]?.load?fmt(sets[0].load)+' kg':'À calibrer'}</div></div>${sets.map((s,i)=>`<div class="setline"><div class="tiny muted">S${i+1}</div><div><label>Charge</label><input class="set-load" type="number" step="${EX[x.exId].inc}" value="${s.load||0}"></div><div><label>Reps</label><input class="set-reps" type="number" value="${s.reps}"></div><div><label>RIR</label><input class="set-rir" type="number" step=".5" min="0" max="5" value="${s.rir}"></div><button class="btn secondary validate" onclick="this.textContent='✓';this.classList.add('p-good')">Valider</button></div>`).join('')}<div class="tiny muted rec" style="margin-top:10px">Après la séance, l'app calculera la charge conseillée pour la prochaine fois selon reps + RIR.</div></section>`}
function workoutSupersets(ss){return `<section class="card"><div class="h2">Supersets bras</div>${ss.map((s,idx)=>`<div class="superset" style="margin-top:10px"><div class="tiny muted">Superset ${String.fromCharCode(65+idx)}</div><div class="h3">${EX[s[0]].name} → ${EX[s[1]].name}</div><div class="small muted">${s[2]} · repos 90 s après les deux</div></div>`).join('')}</section>`}
function finishWorkout(){const exercises=[];$$('.workout-ex').forEach(card=>{const exId=card.dataset.ex,range=card.dataset.range;const sets=[...card.querySelectorAll('.setline')].map(r=>({load:+r.querySelector('.set-load').value,reps:+r.querySelector('.set-reps').value,rir:+r.querySelector('.set-rir').value}));const next=calcNextLoad(exId,range,sets);exercises.push({exId,sets,nextLoad:next.load,note:next.reason})});state.logs.push({id:uid(),date:new Date().toISOString(),week:week(),day:workoutDay,exercises});save();showToast('Séance enregistrée');render()}
function calcNextLoad(exId,range,sets){const ex=EX[exId],{min,max}=parseRange(range);if(!sets.length)return {load:0,reason:''};const first=sets[0].load;const top=sets.every(s=>s.reps>=max&&s.rir>=1);const fail=sets.some(s=>s.reps<min-1||s.rir===0);if(top)return {load:roundTo(first+ex.inc,ex.inc),reason:'Haut de fourchette atteint avec marge → hausse'};if(fail)return {load:Math.max(0,roundTo(first-ex.inc,ex.inc)),reason:'Échec / reps trop basses → baisse légère'};return {load:first,reason:'Dans la zone cible → maintien'} }

function testsView(){return `<div class="stack"><section class="card"><div class="row between"><div><div class="h2">Tests & références</div><div class="small muted">Modifiables à tout moment</div></div><button class="btn primary" onclick="openTestModal()">+ Ajouter</button></div></section>${state.tests.map(t=>testCard(t)).join('')}<section class="card"><div class="h2">Charges de travail connues</div><div class="small muted" style="margin:5px 0 12px">Séparées des tests de force.</div>${Object.entries(state.workingLoads).map(([id,l])=>`<div class="row between" style="margin:8px 0"><span>${EX[id]?.name||id}</span><div class="row"><b>${fmt(l)} kg</b><button class="btn ghost" onclick="editWorkingLoad('${id}')">Modifier</button></div></div>`).join('')}</section></div>`}
function testCard(t){const total=t.exId==='pullup'?(+t.bodyweight||state.profile.weight)+(+t.load||0):+t.load;const e=calcE1RM(total,+t.reps,+t.rir||0);return `<section class="card"><div class="row between wrap"><div><div class="h3">${EX[t.exId].name}</div><div class="small muted">${t.date} · ${t.exId==='pullup'?`PDC ${fmt(t.bodyweight||state.profile.weight)} + ${fmt(t.load)} kg`:`${fmt(t.load)} kg`} × ${t.reps} · RIR ${t.rir}</div></div><div style="text-align:right"><div class="tiny muted">e1RM</div><div class="big">${fmt(e)} kg</div></div></div>${t.note?`<div class="tiny muted" style="margin-top:8px">${t.note}</div>`:''}<div class="row" style="margin-top:10px"><button class="btn secondary" onclick="openTestModal('${t.id}')">Modifier</button><button class="btn danger" onclick="deleteTest('${t.id}')">Supprimer</button></div></section>`}
function openTestModal(id){const t=id?state.tests.find(x=>x.id===id):{id:uid(),exId:'dc',date:TODAY(),load:0,reps:5,rir:1,bodyweight:state.profile.weight,note:''};$('#modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="row between"><div class="h2">${id?'Modifier le test':'Nouveau test'}</div><button class="btn ghost" onclick="closeModal()">Fermer</button></div><div class="grid g2" style="margin-top:14px"><div class="field"><label>Exercice</label><select id="mEx">${Object.entries(EX).filter(([k,v])=>v.principal).map(([k,v])=>`<option value="${k}" ${k===t.exId?'selected':''}>${v.name}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="mDate" type="date" value="${t.date}"></div><div class="field"><label>Charge / lest (kg)</label><input id="mLoad" type="number" step=".5" value="${t.load}"></div><div class="field"><label>Poids du corps (tractions)</label><input id="mBw" type="number" step=".1" value="${t.bodyweight||state.profile.weight}"></div><div class="field"><label>Reps</label><input id="mReps" type="number" step="1" value="${t.reps}"></div><div class="field"><label>RIR</label><input id="mRir" type="number" step=".5" min="0" max="5" value="${t.rir}"></div></div><div class="field" style="margin-top:12px"><label>Note</label><textarea id="mNote" rows="3">${t.note||''}</textarea></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="saveTest('${t.id}',${id?'true':'false'})">Enregistrer</button></div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function saveTest(id,editing){const nt={id,exId:$('#mEx').value,date:$('#mDate').value,load:+$('#mLoad').value,bodyweight:+$('#mBw').value,reps:+$('#mReps').value,rir:+$('#mRir').value,note:$('#mNote').value};if(editing)state.tests=state.tests.map(x=>x.id===id?nt:x);else state.tests.push(nt);save();closeModal();showToast('Test enregistré');render()}
function deleteTest(id){if(confirm('Supprimer ce test ?')){state.tests=state.tests.filter(x=>x.id!==id);save();render()}}
function editWorkingLoad(id){const v=prompt(`Charge de travail actuelle — ${EX[id].name}`,state.workingLoads[id]||0);if(v!==null){state.workingLoads[id]=+v||0;save();render()}}

function settingsView(){return `<div class="stack"><section class="card"><div class="h2">Réglages</div><div class="grid g2" style="margin-top:12px"><div><label>Poids du corps</label><input id="sWeight" type="number" step=".1" value="${state.profile.weight}"></div><div><label>Semaine du cycle</label><input id="sWeek" type="number" min="0" max="20" value="${week()}"></div></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="saveSettings()">Enregistrer</button></section><section class="card"><div class="h2">Données</div><div class="small muted" style="margin:6px 0 12px">Tout reste sur ton appareil (localStorage).</div><div class="grid g2"><button class="btn secondary" onclick="exportData()">Exporter JSON</button><button class="btn danger" onclick="resetAll()">Réinitialiser</button></div></section><section class="card"><div class="h2">Logique du cycle</div><div class="small muted" style="margin-top:8px">S0 calibration · S1–4 hypertrophie · S5 deload · S6–9 force · S10 recalibrage · S11–14 hypertrophie lourde · S15 deload · S16–19 congestion · S20 tests.</div></section></div>`}
function saveSettings(){state.profile.weight=+$('#sWeight').value;state.profile.manualWeek=clamp(+$('#sWeek').value,0,20);save();showToast('Réglages enregistrés');render()}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='muscu-coach-pro-backup.json';a.click();URL.revokeObjectURL(a.href)}
function resetAll(){if(confirm('Tout réinitialiser ?')){localStorage.removeItem(KEY);state=structuredClone(DEFAULT_STATE);save();render()}}

function render(){updateTop();const v=$('#view');if(currentTab==='home')v.innerHTML=homeView();if(currentTab==='program')v.innerHTML=programView();if(currentTab==='workout')v.innerHTML=workoutView();if(currentTab==='tests')v.innerHTML=testsView();if(currentTab==='settings')v.innerHTML=settingsView()}
render();
</script>
</body>
</html>
