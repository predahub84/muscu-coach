const getEx = (id) => EXERCISES.find(e => e.id === id);
const PRINCIPAUX = EXERCISES.filter(e => e.principal);

const REMPLACEMENTS = {
  'squat': ['leg-curl','leg-extension','hip-thrust','presse','adducteurs','abducteurs'],
  'hack-squat': ['leg-curl','leg-extension','hip-thrust','presse','adducteurs','abducteurs'],
  'fentes-bulgares': ['leg-curl','leg-extension','hip-thrust','adducteurs','abducteurs']
};

const SPLIT = [
  { jour:'lundi', nom:'Pectoraux + épaules A', focus:'lourd / tension', exos:[
    {id:'developpe-couche',p:true},{id:'developpe-incline-halteres'},{id:'chest-press'},{id:'ecartes-poulie'},
    {id:'developpe-militaire',p:true},{id:'elevations-laterales'},{id:'reverse-pec-deck'}
  ]},
  { jour:'mardi', nom:'Jambes A', focus:'quadriceps / lourd', exos:[

  ]},
  { jour:'mercredi', nom:'Dos + biceps / triceps A', focus:'lourd / tension', exos:[
    {id:'tractions-lestees',p:true},{id:'rowing-poitrine'},{id:'tirage-vertical-neutre'},{id:'rowing-unilateral-poulie'},{id:'pullover-poulie'},
    {id:'curl-ez'},{id:'extension-triceps'},{id:'curl-incline'},{id:'extension-tete'},{id:'curl-poulie'},{id:'pushdown-corde'}
  ]},
  { jour:'jeudi', nom:'Pectoraux + épaules B', focus:'volume / congestion', exos:[

  ]},
  { jour:'vendredi', nom:'Jambes B', focus:'chaîne postérieure / volume', exos:[
    {id:'souleve-terre-roumain',p:true},{id:'hack-squat',p:true},{id:'hip-thrust'},{id:'leg-curl'},{id:'presse-pieds-hauts'},{id:'leg-extension'},{id:'mollets'}
  ]},
  { jour:'samedi', nom:'Dos + biceps / triceps B', focus:'volume / congestion', exos:[
    {id:'rowing-lourd',p:true},{id:'tirage-vertical'},{id:'rowing-machine'},{id:'rowing-unilateral'},{id:'pullover'},{id:'reverse-fly'},

  ]},
  { jour:'dimanche', nom:'Repos', focus:'récupération', exos:[] }
];
const getJour = (j) => SPLIT.find(s => s.jour === j);
const JOURS_ORDRE = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const JOURS_JS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];

const BLOCKS = [
  { d:0, f:0, phase:'calibration', nom:'Semaine 0 — Calibration', desc:'Tests / recherche des charges de départ sur les mouvements principaux.' },
  { d:1, f:4, phase:'hypertrophie-fondamentale', nom:'Hypertrophie fondamentale', desc:'Séries classiques, double progression, peu d’intensification.', rir:[3,2,1.5,1] },
  { d:5, f:5, phase:'deload', nom:'Deload', desc:'Volume et intensité réduits pour récupérer avant le bloc force.' },
  { d:6, f:9, phase:'force', nom:'Force', desc:'Charges recalculées depuis le dernier e1RM. Provisoires jusqu’au recalibrage.' },
  { d:10, f:10, phase:'recalibrage', nom:'Deload + recalibrage', desc:'Deload + mini-tests pour recalculer le e1RM.' },
  { d:11, f:14, phase:'hypertrophie-lourde', nom:'Hypertrophie lourde', desc:'Structures top-set + back-off calculées automatiquement.', rir:[2,1.5,1,1] },
  { d:15, f:15, phase:'deload', nom:'Deload', desc:'Volume et intensité réduits avant le bloc final.' },
  { d:16, f:19, phase:'volume-congestion', nom:'Volume / congestion / intensification', desc:'Dropset, rest-pause, myo-reps.', rir:[2,1.5,1,1] },
  { d:20, f:20, phase:'recalibrage', nom:'Deload + nouveaux tests', desc:'Fin de cycle : deload + nouvelle batterie de tests.' }
];
const PHASE_LABEL = { 'calibration':'Calibration','hypertrophie-fondamentale':'Hypertrophie fondamentale','deload':'Deload','force':'Force','recalibrage':'Recalibrage','hypertrophie-lourde':'Hypertrophie lourde','volume-congestion':'Volume / congestion' };
const PHASE_COLOR = { 'calibration':'bg-slate-400','hypertrophie-fondamentale':'bg-hyper/90','deload':'bg-deload','force':'bg-force','recalibrage':'bg-deload','hypertrophie-lourde':'bg-hyper','volume-congestion':'bg-accent' };

function getBlock(semaine) {
  const b = BLOCKS.find(b => semaine >= b.d && semaine <= b.f);
  if (b) return b;
  return getBlock(((semaine - 21) % 21));
}
function weekIndexInBlock(semaine, bloc) { return semaine - bloc.d; }
function computeCurrentWeek(dateDebutISO) {
  const debut = new Date(dateDebutISO);
  const ms = 7 * 24 * 60 * 60 * 1000;
  return Math.max(0, Math.floor((Date.now() - debut.getTime()) / ms));
}

/* ============================================================================
   CALCULS — e1RM, arrondis, historique
   ============================================================================ */

function calcE1RM(charge, reps) {
  if (reps <= 0 || charge <= 0) return 0;
  if (reps === 1) return charge;
  return Math.round(charge * (1 + reps / 30) * 100) / 100;
}
const PALIERS = [70,75,80,82.5,85,87.5,90,92.5,95];
function calcPaliers(e1rm) { return PALIERS.map(p => ({ p, charge: Math.round(e1rm * (p/100) * 100)/100 })); }
function arrondir(charge, inc) {
  if (inc <= 0) return Math.round(charge*100)/100;
  const paliers = charge / inc;
  const bas = Math.floor(paliers);
  const reste = paliers - bas;
  return Math.round((reste > 0.9 ? bas+1 : bas) * inc * 100) / 100;
}
function dernierTest(exId, tests) {
  return tests.filter(t => t.exId === exId).sort((a,b) => new Date(b.date)-new Date(a.date))[0];
}
function e1rmRef(exId, tests) { const t = dernierTest(exId, tests); return t ? t.e1rm : 0; }

function historique(exId, tests, logs) {
  let e1rmMax=0, e1rmMaxDate='', meilleurCharge=0, meilleurChargeDate='';
  const records = {};
  const consider = (charge, reps, date) => {
    if (charge > meilleurCharge) { meilleurCharge = charge; meilleurChargeDate = date; }
    const e1 = calcE1RM(charge, reps);
    if (e1 > e1rmMax) { e1rmMax = e1; e1rmMaxDate = date; }
    [3,5,8,10,12].forEach(r => { if (reps <= r) { const ex = records[r]; if (!ex || charge > ex.charge) records[r] = { reps, charge, date }; } });
  };
  tests.filter(t=>t.exId===exId).forEach(t => consider(t.chargeTotale, t.reps, t.date));
  logs.forEach(l => { const ex = l.exos.find(e=>e.exId===exId); if (!ex) return;
    ex.sets.forEach(s => { if (s.chargeR>0 && s.repsR>0) consider(s.chargeR, s.repsR, l.date); }); });
  return { e1rmMax, e1rmMaxDate, meilleurCharge, meilleurChargeDate, records };
}

/* ============================================================================
   MOTEUR DE PRESCRIPTION — génère les séries de la séance selon la phase
   ============================================================================ */

const REPOS = { forceLourd:210, hyper:150, isolation:75, restPause:20 };

function rirHyper(wi) { const t=[3,2,1.5,1]; return t[Math.min(wi,t.length-1)]; }

function setsForce(wi, e1rm, inc) {
  const paliers = [ {n:4,r:5,pm:78.5}, {n:5,r:4,pm:81.5}, {n:5,r:3,pm:85.5}, {n:3,r:3,pm:88.5} ];
  const p = paliers[Math.min(wi, paliers.length-1)];
  if (wi===3) {
    const top = arrondir(e1rm*(p.pm/100), inc), backoff = arrondir(e1rm*((p.pm-10)/100), inc);
    return [
      {n:1,rmin:3,rmax:3,rir:1,pct:p.pm,methode:'aucune',repos:REPOS.forceLourd,note:`Top set ~${top}kg`},
      {n:2,rmin:3,rmax:4,rir:2,pct:p.pm-10,methode:'aucune',repos:REPOS.forceLourd,note:`Back-off ~${backoff}kg`},
      {n:3,rmin:3,rmax:4,rir:2,pct:p.pm-10,methode:'aucune',repos:REPOS.forceLourd}
    ];
  }
  return Array.from({length:p.n},(_,i)=>({n:i+1,rmin:p.r,rmax:p.r+1,rir:2,pct:p.pm,methode:'aucune',repos:REPOS.forceLourd}));
}
function setsHyperLourde() {
  return [
    {n:1,rmin:6,rmax:6,rir:1,methode:'aucune',repos:REPOS.hyper,note:'Charge lourde'},
    {n:2,rmin:5,rmax:6,rir:1,methode:'aucune',repos:REPOS.hyper,note:'Même charge'},
    {n:3,rmin:8,rmax:10,rir:1,methode:'aucune',repos:REPOS.hyper,note:'-10% de la série 1'},
    {n:4,rmin:10,rmax:12,rir:0,methode:'aucune',repos:REPOS.isolation,note:'-5 à -8% supplémentaires'}
  ];
}
function setsHyperFond(wi) {
  const rir = rirHyper(wi);
  return [1,2,3].map(n => ({n,rmin:8,rmax:10,rir,methode:'aucune',repos:REPOS.hyper}));
}
function setsVolumeCongestion(wi, isolation, derniere) {
  const rir = rirHyper(wi);
  const sets = [
    {n:1,rmin:10,rmax:12,rir,methode:'aucune',repos: isolation?REPOS.isolation:REPOS.hyper},
    {n:2,rmin:10,rmax:12,rir,methode:'aucune',repos: isolation?REPOS.isolation:REPOS.hyper}
  ];
  if (derniere) {
    const methode = isolation ? 'myo-reps' : 'dropset';
    sets.push({n:3,rmin:8,rmax:15,rir:0,methode,repos: methode==='myo-reps'?REPOS.restPause:REPOS.hyper,
      note: methode==='dropset' ? 'Dropset : -20 à -25% après l’échec, sans repos' : 'Myo-reps : activation RIR1 puis mini-séries 3-5 reps, 15-20s repos'});
  } else sets.push({n:3,rmin:10,rmax:12,rir,methode:'aucune',repos: isolation?REPOS.isolation:REPOS.hyper});
  return sets;
}
function genererSets(exId, principal, phase, wi, tests, derniere) {
  const ex = getEx(exId); const inc = ex ? ex.inc : 2.5;
  switch(phase) {
    case 'force': {
      if (!principal) return setsHyperFond(2);
      const e1 = e1rmRef(exId, tests);
      return e1 ? setsForce(wi, e1, inc) : setsHyperFond(2);
    }
    case 'hypertrophie-lourde': return setsHyperLourde();
    case 'volume-congestion': return setsVolumeCongestion(wi, !principal, derniere);
    case 'deload': return [{n:1,rmin:10,rmax:12,rir:4,methode:'aucune',repos:REPOS.isolation},{n:2,rmin:10,rmax:12,rir:4,methode:'aucune',repos:REPOS.isolation}];
    case 'recalibrage': case 'calibration': return [];
    default: return setsHyperFond(wi);
  }
}
function construireSeance(jour, semaine, tests, desactives, remplacements) {
  const jp = getJour(jour);
  if (!jp || jp.exos.length===0) return null;
  const bloc = getBlock(semaine); const wi = weekIndexInBlock(semaine, bloc);
  const dernierIdx = jp.exos.length - 1;
  const exercices = jp.exos.map((e,idx) => {
    const idEff = desactives.includes(e.id) ? (remplacements[e.id] || e.id) : e.id;
    return { exId: idEff, sets: genererSets(idEff, !!e.p, bloc.phase, wi, tests, idx===dernierIdx) };
  });
  return { jour: jp.jour, nom: jp.nom, focus: jp.focus, exercices };
}

/* ============================================================================
   MOTEUR DE PROGRESSION
   ============================================================================ */

function recoHyper(sets, ex) {
  if (!sets.length) return { charge:0, dir:'maintien', raison:'Aucune série.' };
  const last = sets[sets.length-1].chargeR, rmax = sets[0].rmax, rmin = sets[0].rmin, rirP = sets[0].rirP;
  const auTop = sets.every(s => s.repsR >= rmax && s.rirR >= rirP - 0.5);
  const dansFourchette = sets.every(s => s.repsR >= rmin);
  const echec = sets.some(s => s.repsR < rmin - 2 || s.rirR <= 0);
  if (auTop) return { charge: arrondir(last+ex.inc, ex.inc), dir:'hausse', raison:`Toutes les séries ont atteint ${rmax} reps avec RIR ≥ ${rirP} : on augmente.` };
  if (echec) return { charge: Math.max(arrondir(last-ex.inc, ex.inc),0), dir:'baisse', raison:'Séries bien en dessous de la fourchette ou échec (RIR 0) : on baisse.' };
  if (dansFourchette) return { charge:last, dir:'maintien', raison:`Reps dans la fourchette (${rmin}-${rmax}) mais en dégradé : on garde la charge.` };
  return { charge:last, dir:'maintien', raison:'Conforme aux attentes : on maintient.' };
}
function recoForce(sets, ex) {
  if (!sets.length) return { charge:0, dir:'maintien', raison:'Aucune série.' };
  const last = sets[sets.length-1], rirMoy = sets.reduce((a,s)=>a+s.rirR,0)/sets.length;
  if (rirMoy >= 3) return { charge: arrondir(last.chargeR+ex.inc, ex.inc), dir:'hausse', raison:`RIR moyen ${rirMoy.toFixed(1)} ≥ 3 : marge trop grande, on augmente.` };
  if (rirMoy <= 0) return { charge: arrondir(last.chargeR-ex.inc, ex.inc), dir:'baisse', raison:'RIR à 0 sur au moins une série : on répète ou baisse légèrement.' };
  return { charge:last.chargeR, dir:'maintien', raison:`RIR moyen ${rirMoy.toFixed(1)} entre 1 et 2 : conforme, on suit le plan.` };
}
function reco(sets, ex, phase) { return phase==='force' ? recoForce(sets,ex) : recoHyper(sets,ex); }

   ============================================================================ */

const STORAGE_KEY = 'muscu-coach-state-v1';
function seedTests(poids) {
  const mk = (id, exId, charge, reps, rir, pdc) => {
    const ct = charge + (pdc||0);
    return { id, exId, date:new Date().toISOString(), charge, pdc, reps, rir, e1rm: calcE1RM(ct,reps), chargeTotale: ct, note:'Donnée de départ' };
  };
  return [
    mk('seed-dc','developpe-couche',75,3,0),
    mk('seed-dm','developpe-militaire',45,4,0),
    mk('seed-tr','tractions-lestees',15,4.5,1,poids),
    mk('seed-dih','developpe-incline-halteres',22,12,2),
    mk('seed-cp','chest-press',40,8,1)
  ];
}
function etatInitial() {
  return { profile:null, dateDebut:new Date().toISOString(), tests:[], logs:[], injuryNotes:[], desactives:[], remplacements:{}, theme:'dark' };
}
function chargerEtat() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return etatInitial();
    return { ...etatInitial(), ...JSON.parse(raw) };
  } catch { return etatInitial(); }
}
function sauvegarderEtat(s) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch(e) { console.error(e); } }
function avecSeedSiVide(s) { if (s.tests.length>0) return s; return { ...s, tests: seedTests(s.profile?.poids || 70) }; }

function telecharger(nom, contenu, mime) {
  const blob = new Blob([contenu], {type:mime}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=nom; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function lignesExport(state) {
  const lignes = [];
  state.logs.forEach(l => l.exos.forEach(ex => {
    const nom = getEx(ex.exId)?.nom || ex.exId;
    ex.sets.forEach(s => lignes.push({ date:l.date.slice(0,10), seance:l.jour, exercice:nom, serie:s.n, chargePrevue:s.chargeP, chargeReelle:s.chargeR, repsPrevues:`${s.rmin}-${s.rmax}`, repsReelles:s.repsR, rirPrevu:s.rirP, rirReel:s.rirR, methode:s.methode }));
  }));
  return lignes;
}
function exportCSV(state) {
  const l = lignesExport(state);
  const h = ['date','seance','exercice','serie','chargePrevue','chargeReelle','repsPrevues','repsReelles','rirPrevu','rirReel','methode'];
  const csv = [h.join(';'), ...l.map(x=>h.map(k=>String(x[k]).replace(';',',')).join(';'))].join('\n');
  telecharger('muscu-coach-export.csv', csv, 'text/csv;charset=utf-8');
}
function exportJSON(state) { telecharger('muscu-coach-export.json', JSON.stringify(state,null,2), 'application/json'); }

const AppCtx = createContext(null);
function AppProvider({ children }) {
  const [state, setState] = useState(() => avecSeedSiVide(chargerEtat()));

  useEffect(() => { document.body.classList.toggle('dark', state.theme==='dark'); document.body.classList.toggle('light', state.theme!=='dark'); }, [state.theme]);

  const setProfile = useCallback(p => setState(s => ({...s, profile:p, dateDebut: p.dateDebut || s.dateDebut})), []);
  const addTest = useCallback(t => setState(s => ({...s, tests:[...s.tests,t]})), []);
  const addLog = useCallback(l => setState(s => { const ex = s.logs.some(x=>x.id===l.id); return {...s, logs: ex ? s.logs.map(x=>x.id===l.id?l:x) : [...s.logs,l]}; }), []);
  const addInjury = useCallback(n => setState(s => ({...s, injuryNotes:[...s.injuryNotes,n]})), []);
  const setDesactives = useCallback((ids, remp) => setState(s => ({...s, desactives:ids, remplacements:{...s.remplacements, ...remp}})), []);

  return <AppCtx.Provider value={{state,setProfile,addTest,addLog,addInjury,setDesactives,toggleTheme,resetAll}}>{children}</AppCtx.Provider>;
}

function Workout({jourInitial}) {
  const { state, addLog } = useApp();
  const [jour, setJour] = useState(jourInitial || JOURS_JS[new Date().getDay()]);
  const semaine = computeCurrentWeek(state.dateDebut);
  const bloc = getBlock(semaine);
  const seance = useMemo(()=>construireSeance(jour, semaine, state.tests, state.desactives, state.remplacements), [jour, semaine, state.tests, state.desactives, state.remplacements]);
  const [logs, setLogs] = useState({});
  const [repos, setRepos] = useState(null);
  const [poidsJour, setPoidsJour] = useState('');
  const [fatigue, setFatigue] = useState('');

  useEffect(() => {
    if (!seance) { setLogs({}); return; }
    const triés = [...state.logs].sort((a,b)=>new Date(b.date)-new Date(a.date));
    const init = {};
    seance.exercices.forEach(pe => {
      const dernier = triés.flatMap(l=>l.exos.filter(e=>e.exId===pe.exId))[0];
      const ex = getEx(pe.exId);
      const e1 = state.tests.filter(t=>t.exId===pe.exId).sort((a,b)=>new Date(b.date)-new Date(a.date))[0]?.e1rm || 0;
      init[pe.exId] = pe.sets.map(s => {
        const prec = dernier?.sets[s.n-1];
        const chargeP = s.pct ? arrondir((e1*s.pct)/100, ex?.inc||2.5) : (prec?.chargeR ?? 0);
        return { n:s.n, chargeP, chargeR:chargeP, rmin:s.rmin, rmax:s.rmax, repsR:s.rmax, rirP:s.rir, rirR:s.rir, methode:s.methode, valide:false };
      });
    });
    setLogs(init);
  }, [seance?.jour, semaine]);

  if (!seance) return (
    <div className="space-y-3"><SelecteurJour jour={jour} setJour={setJour} /><div className="card p-6 text-center text-slate-400">Jour de repos — aucune séance prévue.</div></div>
  );

  const majSet = (exId, n, patch) => setLogs(prev => ({...prev, [exId]: prev[exId].map(s=>s.n===n?{...s,...patch}:s)}));
  const valider = (exId, n, r) => { majSet(exId, n, {valide:true}); setRepos(r); };
  const terminer = () => {
    const exos = seance.exercices.map(pe => ({ exId: pe.exId, sets: logs[pe.exId] || [] }));
    addLog({ id:`log-${jour}-${new Date().toISOString().slice(0,10)}`, date:new Date().toISOString(), jour, semaine, phase:bloc.phase, exos, poidsJour: poidsJour===''?undefined:+poidsJour, fatigue: fatigue===''?undefined:+fatigue, termine:true });
    setLogs({}); setPoidsJour(''); setFatigue('');
  };

  return (
    <div className="space-y-4">
      <SelecteurJour jour={jour} setJour={setJour} />
      <div className="card p-4"><div className="font-bold text-lg">{seance.nom}</div><div className="text-xs text-slate-500 dark:text-slate-400">{seance.focus} · {bloc.nom}</div></div>
      {seance.exercices.map(pe => {
        const ex = getEx(pe.exId);
        const sets = logs[pe.exId] || [];
        const valides = sets.filter(s=>s.valide);
        const r = ex && valides.length===pe.sets.length ? reco(valides, ex, bloc.phase) : null;
        return (
          <div key={pe.exId} className="card p-4">
            <div className="font-semibold mb-3">{ex?.nom}</div>
            <div className="space-y-2.5">
              {pe.sets.map(prescrit => {
                const set = sets.find(s=>s.n===prescrit.n);
                if (!set) return null;
                return (
                  <div key={prescrit.n} className={`card2 p-3 ${set.valide?'opacity-70':''}`}>
                    <div className="flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400 mb-2">
                      <span>Série {prescrit.n} · {prescrit.rmin===prescrit.rmax?prescrit.rmin:`${prescrit.rmin}-${prescrit.rmax}`} reps · RIR {prescrit.rir}{prescrit.pct?` · ${Math.round(prescrit.pct)}%`:''}</span>
                      {prescrit.methode!=='aucune' && <span className="text-accent font-semibold">{prescrit.methode}</span>}
                    </div>
                    <div className="grid grid-cols-3 gap-2">
                      <NumberStepper label="Charge (kg)" value={set.chargeR} step={ex?.inc||2.5} onChange={v=>majSet(pe.exId,prescrit.n,{chargeR:v})} />
                      <NumberStepper label="Reps" value={set.repsR} step={1} onChange={v=>majSet(pe.exId,prescrit.n,{repsR:v})} />
                      <NumberStepper label="RIR" value={set.rirR} step={1} min={0} max={5} onChange={v=>majSet(pe.exId,prescrit.n,{rirR:v})} />
                    </div>
                    <button className={`btn w-full mt-2.5 ${set.valide?'btn-ghost':'btn-primary'}`} onClick={()=>valider(pe.exId,prescrit.n,prescrit.repos)}>{set.valide?'✓ Série validée':'Valider la série'}</button>
                  </div>
                );
              })}
            </div>
            {r && (
              <div className="card2 p-3 mt-3 text-xs">
                <div className="font-semibold mb-0.5">Prochaine séance : <span className={r.dir==='hausse'?'text-emerald-500':r.dir==='baisse'?'text-red-500':'text-slate-400'}>{r.charge} kg ({r.dir})</span></div>
                <div className="text-slate-500 dark:text-slate-400">{r.raison}</div>
              </div>
            )}
          </div>
        );
      })}
      <div className="card p-4 space-y-3">
        <div className="grid grid-cols-2 gap-3">
          <div><label className="label">Poids du jour (kg)</label><input type="number" step="0.1" className="input" value={poidsJour} onChange={e=>setPoidsJour(e.target.value)} /></div>
          <div><label className="label">Fatigue ressentie</label>
            <select className="input" value={fatigue} onChange={e=>setFatigue(e.target.value)}>
              <option value="">—</option>{[1,2,3,4,5].map(n=><option key={n} value={n}>{n}/5</option>)}
            </select>
          </div>
        </div>
        <button className="btn btn-primary w-full" onClick={terminer}>Terminer la séance</button>
      </div>
      {repos!==null && <RestTimer secondes={repos} onTermine={()=>setRepos(null)} />}
    </div>
  );
}

function SelecteurJour({jour, setJour}) {
  return (
    <div className="flex gap-1.5 overflow-x-auto pb-1">
      {JOURS_ORDRE.map(j=>(
        <button key={j} onClick={()=>setJour(j)} className={`px-3 py-1.5 rounded-full text-xs font-semibold shrink-0 capitalize ${jour===j?'bg-accent text-white':'card2 text-slate-500 dark:text-slate-400'}`}>{j}</button>
      ))}
    </div>
  );
}

function History() {
  const { state } = useApp();
  const [filtre, setFiltre] = useState('');
  const exercicesAvecDonnees = useMemo(() => EXERCISES.filter(ex => {
    const t = state.tests.some(t=>t.exId===ex.id);
    const l = state.logs.some(l=>l.exos.some(e=>e.exId===ex.id && e.sets.some(s=>s.chargeR>0)));
    return (t||l) && ex.nom.toLowerCase().includes(filtre.toLowerCase());
  }), [state.tests, state.logs, filtre]);

  return (
    <div className="space-y-4">
      <div className="card p-4"><h2 className="font-bold mb-1">Historique & records</h2><input className="input" placeholder="Filtrer un exercice..." value={filtre} onChange={e=>setFiltre(e.target.value)} /></div>
      {exercicesAvecDonnees.length===0 && <div className="card p-6 text-center text-slate-400 text-sm">Pas encore de données.</div>}
      {exercicesAvecDonnees.map(ex => { const h = historique(ex.id, state.tests, state.logs); return (
        <div key={ex.id} className="card p-4">
          <div className="flex items-center justify-between mb-2"><span className="font-semibold">{ex.nom}</span><span className="text-xs text-slate-500 dark:text-slate-400">e1RM max {h.e1rmMax} kg</span></div>
          <div className="text-xs mb-2 text-slate-500 dark:text-slate-400">Meilleure charge : <strong className="text-slate-800 dark:text-slate-100">{h.meilleurCharge} kg</strong></div>
          <div className="flex gap-1.5 overflow-x-auto">
            {[3,5,8,10,12].map(r => { const rec = h.records[r]; return (
              <div key={r} className="card2 px-2.5 py-1.5 text-center shrink-0"><div className="text-[10px] text-slate-500 dark:text-slate-400">{r}RM</div><div className="text-xs font-bold">{rec?`${rec.charge}kg`:'—'}</div></div>
            );})}
          </div>
        </div>
      );})}
      <div className="card p-4 space-y-2"><h3 className="font-bold mb-1">Export</h3>
        <div className="grid grid-cols-2 gap-2"><button className="btn btn-ghost" onClick={()=>exportCSV(state)}>CSV</button><button className="btn btn-ghost" onClick={()=>exportJSON(state)}>JSON</button></div>
      </div>
    </div>
  );
}

/* Petit chart SVG maison (pas de dépendance externe) */
function MiniChart({data, keys, colors, height=180}) {
  if (!data.length) return <div className="text-xs text-slate-400">Pas de données.</div>;
  const w = 320;
  const allVals = data.flatMap(d=>keys.map(k=>d[k]||0));
  const max = Math.max(...allVals, 1), min = Math.min(...allVals, 0);
  const range = max-min || 1;
  const stepX = data.length>1 ? w/(data.length-1) : 0;
  const y = v => height - ((v-min)/range)*height*0.85 - 8;
  return (
    <svg viewBox={`0 0 ${w} ${height}`} className="w-full" style={{height}}>
      {keys.map((k,ki) => {
        const pts = data.map((d,i)=>`${i*stepX},${y(d[k]||0)}`).join(' ');
        return <polyline key={k} points={pts} fill="none" stroke={colors[ki]} strokeWidth="2" />;
      })}
    </svg>
  );
}
function BarChartSVG({data, height=180, color='#ff5a36'}) {
  if (!data.length) return <div className="text-xs text-slate-400">Pas de données.</div>;
  const w = 320, max = Math.max(...data.map(d=>d.v), 1);
  const bw = w/data.length;
  return (
    <svg viewBox={`0 0 ${w} ${height}`} className="w-full" style={{height}}>
      {data.map((d,i) => { const h = (d.v/max)*height*0.85; return (
        <rect key={i} x={i*bw+2} y={height-h} width={bw-4} height={h} fill={color} rx="3" />
      );})}
    </svg>
  );
}

function Charts() {
  const { state } = useApp();
  const exercicesAvecDonnees = EXERCISES.filter(ex => state.logs.some(l=>l.exos.some(e=>e.exId===ex.id && e.sets.some(s=>s.chargeR>0))));
  const [exId, setExId] = useState(exercicesAvecDonnees[0]?.id || '');
  const evolution = useMemo(() => {
    if (!exId) return [];
    return [...state.logs].sort((a,b)=>new Date(a.date)-new Date(b.date)).flatMap(l => {
      const ex = l.exos.find(e=>e.exId===exId); if (!ex) return [];
      const best = ex.sets.reduce((b,s)=>s.chargeR>(b?.chargeR||0)?s:b, ex.sets[0]); if (!best) return [];
      return [{ charge: best.chargeR, e1rm: calcE1RM(best.chargeR, best.repsR) }];
    });
  }, [exId, state.logs]);
  const poids = useMemo(() => state.logs.filter(l=>l.poidsJour).sort((a,b)=>new Date(a.date)-new Date(b.date)).map(l=>({poids:l.poidsJour})), [state.logs]);
  const volumeSeance = useMemo(() => [...state.logs].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(l=>({v:Math.round(l.exos.reduce((a,ex)=>a+ex.sets.reduce((x,s)=>x+s.chargeR*s.repsR,0),0))})), [state.logs]);
  const volumeMuscle = useMemo(() => {
    const t = {};
    state.logs.forEach(l=>l.exos.forEach(ex=>{ const info=getEx(ex.exId); if(!info) return; const v=ex.sets.reduce((a,s)=>a+s.chargeR*s.repsR,0); t[info.cat]=(t[info.cat]||0)+v; }));
    return Object.entries(t).map(([cat,v])=>({cat,v:Math.round(v)}));
  }, [state.logs]);

  if (state.logs.length===0) return <div className="card p-6 text-center text-slate-400 text-sm">Pas encore de séances enregistrées.</div>;

  return (
    <div className="space-y-4">
      {exercicesAvecDonnees.length>0 && (
        <div className="card p-4">
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-bold">Progression par exercice</h3>
            <select className="input w-auto text-xs" value={exId} onChange={e=>setExId(e.target.value)}>{exercicesAvecDonnees.map(ex=><option key={ex.id} value={ex.id}>{ex.nom}</option>)}</select>
          </div>
          <MiniChart data={evolution} keys={['e1rm','charge']} colors={['#ff5a36','#5b8cff']} />
          <div className="flex gap-4 mt-2 text-[11px]"><span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full inline-block" style={{background:'#ff5a36'}}></span>e1RM</span><span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full inline-block" style={{background:'#5b8cff'}}></span>Charge</span></div>
        </div>
      )}
      {poids.length>0 && <div className="card p-4"><h3 className="font-bold mb-3">Poids du corps</h3><MiniChart data={poids} keys={['poids']} colors={['#5b8cff']} /></div>}
      <div className="card p-4"><h3 className="font-bold mb-3">Volume total par séance</h3><BarChartSVG data={volumeSeance} /></div>
      <div className="card p-4"><h3 className="font-bold mb-3">Volume par muscle</h3>
        <div className="space-y-1.5">{volumeMuscle.sort((a,b)=>b.v-a.v).map(m=>(
          <div key={m.cat} className="flex items-center gap-2 text-xs">
            <span className="w-24 shrink-0 capitalize text-slate-500 dark:text-slate-400">{m.cat}</span>
            <div className="flex-1 h-3 rounded-full bg-black/5 dark:bg-white/10 overflow-hidden"><div className="h-full bg-force" style={{width:`${(m.v/Math.max(...volumeMuscle.map(x=>x.v),1))*100}%`}}></div></div>
            <span className="w-14 text-right font-semibold">{m.v}kg</span>
          </div>
        ))}</div>
      </div>
    </div>
  );
}

function InjuryMode() {
  const { state, addInjury, setDesactives } = useApp();
  const [zone, setZone] = useState('');
  const [note, setNote] = useState('');
  const [choisis, setChoisis] = useState([]);
  const [remp, setRemp] = useState({});
  const toggle = id => setChoisis(p => p.includes(id) ? p.filter(x=>x!==id) : [...p,id]);
  const enregistrer = () => {
    addInjury({ id:`inj-${Date.now()}`, date:new Date().toISOString(), zone, note, exos: choisis });
    setDesactives(Array.from(new Set([...state.desactives, ...choisis])), remp);
    setZone(''); setNote(''); setChoisis([]); setRemp({});
  };
  const reactiver = id => setDesactives(state.desactives.filter(e=>e!==id), {});

  return (
    <div className="space-y-4">
      <div className="card p-4">
        <h2 className="font-bold mb-1">Mode blessure / adaptation</h2>
        <p className="text-xs text-slate-500 dark:text-slate-400 mb-3">Désactive temporairement des exercices, avec remplacement suggéré.</p>
        <label className="label">Zone / douleur</label><input className="input mb-3" placeholder="ex : douleur cheville" value={zone} onChange={e=>setZone(e.target.value)} />
        <label className="label">Note</label><input className="input mb-3" placeholder="ex : gonflement après séance" value={note} onChange={e=>setNote(e.target.value)} />
        <label className="label">Exercices à désactiver</label>
        <div className="grid grid-cols-2 gap-1.5 mb-3 max-h-48 overflow-y-auto">
          {EXERCISES.map(ex => (
            <label key={ex.id} className="flex items-center gap-2 text-xs card2 px-2 py-1.5"><input type="checkbox" checked={choisis.includes(ex.id)} onChange={()=>toggle(ex.id)} />{ex.nom}</label>
          ))}
        </div>
        {choisis.map(id => { const sugg = REMPLACEMENTS[id] || EXERCISES.map(e=>e.id); const exo = EXERCISES.find(e=>e.id===id); return (
          <div key={id} className="mb-2"><label className="label">Remplacer {exo?.nom} par</label>
            <select className="input" value={remp[id]||''} onChange={e=>setRemp(r=>({...r,[id]:e.target.value}))}>
              <option value="">— aucun —</option>{sugg.map(sid=><option key={sid} value={sid}>{EXERCISES.find(e=>e.id===sid)?.nom}</option>)}
            </select>
          </div>
        );})}
        <button className="btn btn-primary w-full mt-2" onClick={enregistrer} disabled={!zone}>Enregistrer et adapter</button>
      </div>
      {state.desactives.length>0 && (
        <div className="card p-4"><h3 className="font-bold mb-2">Exercices désactivés</h3>
          <div className="space-y-1.5">{state.desactives.map(id=>(
            <div key={id} className="flex items-center justify-between card2 px-3 py-2">
              <span className="text-sm">{EXERCISES.find(e=>e.id===id)?.nom}{state.remplacements[id] && <span className="text-xs text-slate-400"> → {EXERCISES.find(e=>e.id===state.remplacements[id])?.nom}</span>}</span>
              <button className="text-xs text-accent font-semibold" onClick={()=>reactiver(id)}>Réactiver</button>
            </div>
          ))}</div>
        </div>
      )}
    </div>
  );
}

function Settings() {
  const { state, toggleTheme, resetAll } = useApp();
  const [confirm, setConfirm] = useState(false);
  return (
    <div className="space-y-4">
      <div className="card p-4 flex items-center justify-between">
        <div><div className="font-bold">Thème</div><div className="text-xs text-slate-500 dark:text-slate-400">Sombre ou clair</div></div>
        <button className="btn btn-ghost" onClick={toggleTheme}>{state.theme==='dark'?'🌙 Sombre':'☀️ Clair'}</button>
      </div>
      <div className="card p-4"><h3 className="font-bold mb-3">Profil</h3><ProfileForm /></div>
      <div className="card p-4 space-y-2"><h3 className="font-bold mb-1">Export</h3>
        <div className="grid grid-cols-2 gap-2"><button className="btn btn-ghost" onClick={()=>exportCSV(state)}>CSV</button><button className="btn btn-ghost" onClick={()=>exportJSON(state)}>JSON</button></div>
      </div>
      <div className="card p-4">
        <h3 className="font-bold mb-1 text-red-500">Zone dangereuse</h3>
        <p className="text-xs text-slate-500 dark:text-slate-400 mb-3">Réinitialise entièrement l’application.</p>
        {!confirm ? <button className="btn btn-ghost text-red-500" onClick={()=>setConfirm(true)}>Réinitialiser toutes les données</button> : (
          <div className="flex gap-2">
            <button className="btn bg-red-500 text-white flex-1" onClick={()=>{resetAll(); setConfirm(false);}}>Confirmer</button>
            <button className="btn btn-ghost flex-1" onClick={()=>setConfirm(false)}>Annuler</button>
          </div>
        )}
      </div>
    </div>
  );
}

const TABS = [
  {id:'dashboard', label:'Accueil', icon:'🏠'}, {id:'programme', label:'Programme', icon:'📅'}, {id:'workout', label:'Séance', icon:'🏋️'},
  {id:'tests', label:'Tests', icon:'🎯'}, {id:'historique', label:'Historique', icon:'📈'}, {id:'graphiques', label:'Graphes', icon:'📊'},
  {id:'blessure', label:'Adaptation', icon:'🩹'}, {id:'reglages', label:'Réglages', icon:'⚙️'}
];

function App() {
  const { state } = useApp();
  const [tab, setTab] = useState('dashboard');
  const [jourForce, setJourForce] = useState(null);

  if (!state.profile) {
    return (
      <div className="min-h-screen flex items-center justify-center p-4">
        <div className="w-full max-w-md">
          <h1 className="text-2xl font-extrabold mb-1">Muscu Coach</h1>
          <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">Configure ton profil pour démarrer.</p>
          <ProfileForm />
        </div>
      </div>
    );
  }

  const ouvrirSeance = j => { setJourForce(j); setTab('workout'); };

  return (
    <div className="min-h-screen pb-24">
      <header className="sticky top-0 z-20 bg-bg/90 dark:bg-bg-dark/90 backdrop-blur border-b border-black/5 dark:border-white/5 px-4 py-3">
        <div className="text-xs text-slate-500 dark:text-slate-400">Salut {state.profile.prenom} 👋</div>
        <div className="font-extrabold text-lg leading-tight">Muscu Coach</div>
      </header>
      <main className="max-w-3xl mx-auto px-4 py-4">
        {tab==='dashboard' && <Dashboard onOuvrirSeance={ouvrirSeance} onNaviguer={setTab} />}
        {tab==='programme' && <ProgramView onOuvrirSeance={ouvrirSeance} />}
        {tab==='workout' && <Workout jourInitial={jourForce} />}
        {tab==='tests' && <Tests />}
        {tab==='historique' && <History />}
        {tab==='graphiques' && <Charts />}
        {tab==='blessure' && <InjuryMode />}
        {tab==='reglages' && <Settings />}
      </main>
      <nav className="fixed bottom-0 left-0 right-0 z-20 bg-surface/95 dark:bg-surface-dark/95 backdrop-blur border-t border-black/5 dark:border-white/5">
        <div className="max-w-3xl mx-auto grid grid-cols-4 sm:grid-cols-8">
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} className={`flex flex-col items-center gap-0.5 py-2 text-[10px] font-medium transition ${tab===t.id?'text-accent':'text-slate-400 dark:text-slate-500'}`}>
              <span className="text-base leading-none">{t.icon}</span>{t.label}
            </button>
          ))}
        </div>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppProvider><App /></AppProvider>);
</script>
